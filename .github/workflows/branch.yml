---
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Terraform ${{ matrix.terraform-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        terraform-version:
          - 1.3.2
          - 1.15.8

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform-version }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: test/src/go.mod
          cache-dependency-path: test/src/go.sum

      - name: Set up Atmos
        if: matrix.terraform-version == '1.15.8'
        uses: cloudposse/github-action-setup-atmos@v3.5.0
        with:
          atmos-version: 1.216.0

      - name: Validate module
        env:
          RUN_OPTIONAL_GATES: ${{ matrix.terraform-version == '1.15.8' }}
        shell: pwsh
        run: |
          if ($env:RUN_OPTIONAL_GATES -eq 'true') {
            ./scripts/Publish-TerraformModule.ps1
          }
          else {
            ./scripts/Publish-TerraformModule.ps1 -SkipReadme -SkipTerraformFormat
          }
