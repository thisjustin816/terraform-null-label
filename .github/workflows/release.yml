---
name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version, with or without a leading v
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, tag, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release request
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must run from the main branch."
            exit 1
          fi

          if [[ ! "$REQUESTED_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be valid SemVer, such as v1.2.3 or 1.2.3-rc.1."
            exit 1
          fi

          if [[ "$REQUESTED_VERSION" == v* ]]; then
            version="$REQUESTED_VERSION"
          else
            version="v$REQUESTED_VERSION"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: test/src/go.mod
          cache-dependency-path: test/src/go.sum

      - name: Validate module and publish tag
        env:
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          VERSION: ${{ steps.release.outputs.version }}
        shell: pwsh
        run: ./scripts/Publish-TerraformModule.ps1 -SkipReadme -Version $env:VERSION -Push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          arguments=(
            "$VERSION"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "$VERSION"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            arguments+=(--prerelease)
          fi

          gh release create "${arguments[@]}"
