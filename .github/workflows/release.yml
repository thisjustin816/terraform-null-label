---
name: Publish release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

# Advance these values intentionally to start a new release line. Each
# successful CI run on main publishes the next patch in the configured line.
env:
  RELEASE_MAJOR: 1
  RELEASE_MINOR: 2

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, tag, and publish
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the next patch version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          component_pattern='^(0|[1-9][0-9]*)$'
          if [[ ! "$RELEASE_MAJOR" =~ $component_pattern || ! "$RELEASE_MINOR" =~ $component_pattern ]]; then
            echo "::error::RELEASE_MAJOR and RELEASE_MINOR must be non-negative integers without leading zeros."
            exit 1
          fi

          tag_pattern="^v${RELEASE_MAJOR}\\.${RELEASE_MINOR}\\.(0|[1-9][0-9]*)$"
          current_version=''

          while IFS= read -r tag; do
            if [[ "$tag" =~ $tag_pattern ]]; then
              if [[ -n "$current_version" ]]; then
                echo "::error::The current commit has multiple release tags in the configured release line."
                exit 1
              fi

              current_version="$tag"
            fi
          done < <(git tag --points-at HEAD --list "v${RELEASE_MAJOR}.${RELEASE_MINOR}.*")

          if [[ -n "$current_version" ]]; then
            echo "version=$current_version" >> "$GITHUB_OUTPUT"
            echo "tag_required=false" >> "$GITHUB_OUTPUT"

            if gh release view "$current_version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release_required=false" >> "$GITHUB_OUTPUT"
              echo "Release $current_version already exists for this commit."
            else
              echo "release_required=true" >> "$GITHUB_OUTPUT"
              echo "Tag $current_version already exists; the missing GitHub Release will be created."
            fi

            exit 0
          fi

          latest_patch=-1
          while IFS= read -r tag; do
            if [[ "$tag" =~ $tag_pattern ]]; then
              patch="${BASH_REMATCH[1]}"
              if (( patch > latest_patch )); then
                latest_patch=$patch
              fi
            fi
          done < <(git tag --list "v${RELEASE_MAJOR}.${RELEASE_MINOR}.*")

          version="v${RELEASE_MAJOR}.${RELEASE_MINOR}.$((latest_patch + 1))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_required=true" >> "$GITHUB_OUTPUT"
          echo "release_required=true" >> "$GITHUB_OUTPUT"
          echo "Next release: $version"

      - name: Set up Terraform
        if: steps.release.outputs.tag_required == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Set up Go
        if: steps.release.outputs.tag_required == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: test/src/go.mod
          cache-dependency-path: test/src/go.sum

      - name: Validate module and publish tag
        if: steps.release.outputs.tag_required == 'true'
        env:
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          VERSION: ${{ steps.release.outputs.version }}
        shell: pwsh
        run: ./scripts/Publish-TerraformModule.ps1 -SkipReadme -Version $env:VERSION -Push

      - name: Create GitHub Release
        if: steps.release.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes
